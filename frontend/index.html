<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusPulse 2026</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1c2733; }
  header { background: #12355b; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header button { width: auto; padding: 4px 10px; margin: 0 0 0 10px; font-size: 14px; }
  main { padding: 20px; max-width: 1100px; margin: auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card, .panel { background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .num { font-size: 28px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #e3e8ee; }
  .bar { background: #2f80ed; height: 10px; border-radius: 4px; }
  .high { color: #c0392b; font-weight: 600; }
  .medium { color: #d68910; font-weight: 600; }
  #login { max-width: 320px; margin: 60px auto; }
  input, button { font-size: 16px; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  button { background: #12355b; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #msg { color: #c0392b; min-height: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <strong>CampusPulse 2026</strong>
  <span><span id="who"></span><button id="logout" class="hidden">Log out</button></span>
</header>

<section id="login" class="panel">
  <h2>Log in</h2>
  <form id="loginForm">
    <input id="user" placeholder="Username" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <div id="msg"></div>
</section>

<main id="dash" class="hidden">
  <div class="cards">
    <div class="card"><div>Total events</div><div class="num" id="total">-</div></div>
    <div class="card"><div>Alerts</div><div class="num" id="alertCount">-</div></div>
    <div class="card"><div>High severity</div><div class="num" id="high">-</div></div>
    <div class="card"><div>Average temperature</div><div class="num" id="avgtemp">-</div></div>
  </div>
  <div class="grid">
    <div class="panel"><h3>Current occupancy</h3><table id="occ"></table></div>
    <div class="panel"><h3>Energy by building (kWh)</h3><div id="energy"></div></div>
    <div class="panel"><h3>Events by building</h3><div id="bybuilding"></div></div>
    <div class="panel"><h3>Events by type</h3><div id="bytype"></div></div>
  </div>
  <div class="panel" style="margin-bottom:12px"><h3>Latest alerts</h3><table id="alertsTable"></table></div>
  <div class="panel"><h3>Recent events</h3><table id="eventsTable"></table></div>
  <p id="status"></p>
</main>

<script>
const API_URL = "https://plh673d9jf.execute-api.eu-west-1.amazonaws.com/Prod";
const CLIENT_ID = "7n3lggj1v3tgjm6pp1pfqa9pdt";
const REGION = "eu-west-1";

let token = null;
let timer = null;

const $ = id => document.getElementById(id);

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function payload(t) {
  return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
}

async function login(user, pass) {
  const res = await fetch("https://cognito-idp." + REGION + ".amazonaws.com/", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-amz-json-1.1",
      "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth"
    },
    body: JSON.stringify({
      AuthFlow: "USER_PASSWORD_AUTH",
      ClientId: CLIENT_ID,
      AuthParameters: { USERNAME: user, PASSWORD: pass }
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || "Login failed");
  return data.AuthenticationResult.IdToken;
}

function logout(message) {
  token = null;
  clearInterval(timer);
  $("dash").classList.add("hidden");
  $("logout").classList.add("hidden");
  $("who").textContent = "";
  $("login").classList.remove("hidden");
  $("msg").textContent = message || "";
}

async function api(path) {
  const res = await fetch(API_URL + path, { headers: { Authorization: token } });
  if (res.status === 401) {
    logout("Session expired, please log in again.");
    throw new Error("expired");
  }
  if (!res.ok) throw new Error(res.status + " " + (await res.text()));
  return res.json();
}

function fillTable(id, headers, rows) {
  const table = $(id);
  table.replaceChildren();
  const head = el("tr");
  headers.forEach(h => head.appendChild(el("th", h)));
  table.appendChild(head);
  rows.forEach(row => {
    const tr = el("tr");
    row.forEach(cell => {
      const isObj = typeof cell === "object";
      tr.appendChild(el("td", String(isObj ? cell.text : cell), isObj ? cell.cls : undefined));
    });
    table.appendChild(tr);
  });
}

function fillBars(id, data) {
  const box = $(id);
  box.replaceChildren();
  const entries = Object.entries(data);
  if (!entries.length) { box.textContent = "No data yet"; return; }
  const max = Math.max(1, ...entries.map(e => e[1]));
  entries.forEach(([name, value]) => {
    const row = el("div");
    row.style.margin = "6px 0";
    row.appendChild(el("div", name + ": " + value));
    const bar = el("div", undefined, "bar");
    bar.style.width = (100 * value / max) + "%";
    row.appendChild(bar);
    box.appendChild(row);
  });
}

async function refresh() {
  try {
    const [stats, alertData, eventData] = await Promise.all([
      api("/stats"), api("/alerts"), api("/events")
    ]);
    $("total").textContent = stats.total_events;
    $("alertCount").textContent = stats.alert_count;
    $("high").textContent = stats.by_severity.high || 0;
    $("avgtemp").textContent = stats.average_temperature === null ? "-" : stats.average_temperature + " °C";

    fillTable("occ", ["Room", "People"], Object.entries(stats.latest_occupancy));
    fillBars("energy", stats.energy_by_building);
    fillBars("bybuilding", stats.by_building);
    fillBars("bytype", stats.by_type);

    fillTable("alertsTable", ["Time", "Where", "Type", "Value", "Severity"],
      alertData.alerts.slice(0, 10).map(a => [a.timestamp, a.building + "/" + a.room, a.event_type, a.value, { text: a.severity, cls: a.severity }]));
    fillTable("eventsTable", ["Time", "Where", "Type", "Value", "Severity"],
      eventData.events.slice(0, 15).map(e => [e.timestamp, e.building + "/" + e.room, e.event_type, e.value, { text: e.severity, cls: e.severity }]));

    $("status").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (err) {
    if (err.message !== "expired") {
      $("status").textContent = "Could not load data: " + err.message + " (press F12 and look at the Console)";
    }
  }
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("msg").textContent = "";
  try {
    token = await login($("user").value.trim(), $("pass").value);
    $("pass").value = "";
    const info = payload(token);
    const groups = info["cognito:groups"] || [];
    if (!groups.includes("admin") && !groups.includes("staff")) {
      logout("This account (" + (groups.join(", ") || "no group") + ") may not view the dashboard.");
      return;
    }
    $("who").textContent = info["cognito:username"] + " (" + groups.join(", ") + ")";
    $("login").classList.add("hidden");
    $("dash").classList.remove("hidden");
    $("logout").classList.remove("hidden");
    refresh();
    timer = setInterval(refresh, 10000);
  } catch (err) {
    $("msg").textContent = err.message;
  }
});

$("logout").addEventListener("click", () => logout(""));
</script>
</body>
</html>
